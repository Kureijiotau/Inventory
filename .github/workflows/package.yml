name: Release

# On every push to main: build Inventory.exe, wrap it in the setup wizard, and
# publish both as a new release. The README download link and the in-app
# Update button both read from the newest release.
on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build program
        shell: pwsh
        run: ./build.ps1 $env:VERSION

      - name: Build setup wizard
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Setup wizard build failed" }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Remove the old zip-only release from before the app became a program.
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create "v$env:VERSION" dist/InventorySetup.exe dist/version.txt `
            --target $env:GITHUB_SHA `
            --title "Version $env:VERSION" `
            --notes "Built automatically from commit $env:GITHUB_SHA."
          if ($LASTEXITCODE -ne 0) { throw "Publishing failed" }
